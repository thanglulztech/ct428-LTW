<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Regist</title>
</head>
<body>
    <h1>Regist</h1>
    <form class="form" action="#" method="post" enctype="multipart/form-data">
        <selection class="word">
            <div class="inputbox">
                <label class="username" for="username">Fullname</label>
                <input type="text" id="username" name="username" placeholder="Enter your full name" required><br><br>
            </div>
            <div class="inputbox">
                <label class="email" for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
            </div>
            <div class="inputbox">
                <label class="psw" for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
            </div>
            <div class="inputbox">
                <label class="rep" for="repeatpassword">Repeat Password</label>
                <input type="password" id="repeatpassword" name="repeatpassword" placeholder="Repeat Password" required><br><br>
            </div>
            <div class="inputbox">
                <label class="date" for="date">Date of Birth</label>
                <input type="date" id="date" name="date" required><br><br>
            </div>
        </selection>
        <div class="inputradio">
            Male<input class="male" type="radio" value="Male" name="Male">

            Female<input class="female" type="radio" value="Female" name="Female"><br>
        </div>
        <selection class="subres">
            <input class="reset" type="reset" value="Reset">
            <input class="submit" type="submit" value="Submit">
        </selection>
</body>
</html>
